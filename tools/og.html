<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Archivo";src:url("../assets/fonts/archivo-var.woff2") format("woff2-variations");font-weight:100 900;font-stretch:62% 125%}
  @font-face{font-family:"Instrument Serif";src:url("../assets/fonts/instrument-serif-italic.woff2") format("woff2");font-style:italic}
  @font-face{font-family:"JetBrains Mono";src:url("../assets/fonts/jetbrains-mono-var.woff2") format("woff2-variations");font-weight:100 800}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0B0B0C}
  .og{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:1fr 452px;background:#0B0B0C}
  .og::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 120% at 22% -10%,rgba(255,90,31,.22),transparent 62%)}
  .l{position:relative;z-index:2;padding:56px 46px 48px 62px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:baseline;gap:12px;font-family:"Archivo";font-weight:700;font-variation-settings:"wdth" 112,"wght" 700;font-size:30px;letter-spacing:-.02em;color:#F4F1EC;text-transform:uppercase}
  .brand i{font-family:"JetBrains Mono";font-style:normal;font-size:12px;letter-spacing:.2em;color:rgba(244,241,236,.55)}
  .kick{margin-top:38px;font-family:"JetBrains Mono";font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:#FF5A1F}
  h1{margin-top:16px;font-family:"Archivo";font-weight:600;font-variation-settings:"wdth" 108,"wght" 620;font-size:74px;line-height:.96;letter-spacing:-.035em;color:#F4F1EC;text-transform:uppercase}
  h1 em{font-family:"Instrument Serif";font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em}
  h1 .dot{color:#FF5A1F}
  .sub{margin-top:20px;max-width:52ch;font-family:"Archivo";font-size:17.5px;line-height:1.55;color:rgba(244,241,236,.6)}
  .bar{margin-top:auto;display:flex;gap:30px;padding-top:22px;border-top:1px solid rgba(244,241,236,.16)}
  .bar div{font-family:"Archivo";font-weight:600;font-variation-settings:"wdth" 104,"wght" 620;font-size:26px;line-height:1;color:#F4F1EC}
  .bar span{display:block;margin-top:7px;font-family:"JetBrains Mono";font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,241,236,.42)}
  .r{position:relative;overflow:hidden;border-left:1px solid rgba(244,241,236,.14)}
  .r img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:saturate(.92) contrast(1.05)}
  .r::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(11,11,12,.85),transparent 46%)}
  .tag{position:absolute;z-index:3;top:0;left:0;background:#FF5A1F;color:#0B0B0C;padding:10px 14px;font-family:"JetBrains Mono";font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  .spec{position:absolute;z-index:3;left:22px;bottom:26px;color:#F4F1EC}
  .spec b{display:block;font-family:"Archivo";font-weight:600;font-variation-settings:"wdth" 108,"wght" 640;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:-.02em}
  .spec span{display:block;margin-top:8px;font-family:"JetBrains Mono";font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,241,236,.6)}
</style>
</head>
<body>
<div class="og">
  <div class="l">
    <div class="brand"><span>ISHOTGIRLS</span><i>№02</i></div>
    <p class="kick">The Training Journal · Issue №02</p>
    <h1>Протокол,<br>а не <em>мотивация</em><span class="dot">.</span></h1>
    <p class="sub">Шесть досье: сессии, тоннаж, рекорды, еда, восстановление. Без ретуши, без фильтров, без постеров.</p>
    <div class="bar">
      <div>6<span>Досье</span></div>
      <div>214<span>Рекордов</span></div>
      <div>12 480<span>Тренировок</span></div>
      <div>14<span>Дней цикл</span></div>
    </div>
  </div>
  <div class="r">
    <span class="tag">Обложка · №02</span>
    <img src="../assets/img/hero-1000.webp" alt="">
    <div class="spec"><b>Anna · A01</b><span>Силовой цикл · неделя 6/8</span></div>
  </div>
</div>
</body>
</html>
